# Jekyll configuration for the project home page.
#
# This folder is built by .github/workflows/blueprint.yml and becomes the root
# of https://martyall.github.io/euclid-primes/ . CI copies the blueprint (web +
# pdf) into it before running Jekyll, so they end up served at /blueprint/ and
# /blueprint.pdf. Do not add `blueprint` to `exclude`: Jekyll has to copy it
# into _site verbatim.

title: Euclid's Theorem from First Principles
description: A Lean 4 formalization of the infinitude of the primes, built from first principles
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://martyall.github.io/euclid-primes" # the base hostname & protocol for your site
github_username: martyall
repository: martyall/euclid-primes

# Build settings
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-github-metadata
