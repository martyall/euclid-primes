name: Create Release

on:
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'lean-toolchain'

jobs:
  lean-release-tag:
    name: Add Lean release tag
    # The action diffs `github.event.before..after` for changes to
    # lean-toolchain. On a push that *creates* the branch, `before` is all
    # zeros and that range is invalid, so skip those pushes.
    if: ${{ !github.event.created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: lean-release-tag action
      uses: leanprover-community/lean-release-tag@v1
      with:
        do-release: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
